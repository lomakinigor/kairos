<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairos — Статистика установок</title>
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">OWNER ANALYTICS</p>
        <h1>Установки Kairos</h1>
        <p class="subtitle">Уникальные запуски приложения</p>
      </div>
      <button id="refresh" aria-label="Обновить статистику">Обновить</button>
    </header>

    <section class="hero-card" aria-label="Всего установок">
      <span class="metric-label">ВСЕГО УСТАНОВОК</span>
      <strong id="total">—</strong>
      <span class="live"><i></i> Данные Cloudflare D1</span>
    </section>

    <section class="grid" aria-label="Периоды">
      <article><span>Сегодня</span><strong id="today">—</strong></article>
      <article><span>За 7 дней</span><strong id="week">—</strong></article>
      <article><span>За 30 дней</span><strong id="month">—</strong></article>
      <article><span>Активны за 30 дней</span><strong id="active">—</strong></article>
    </section>

    <section class="versions-card">
      <div class="section-head">
        <h2>Версии приложения</h2>
        <span>установок</span>
      </div>
      <div id="versions" class="versions" aria-live="polite"></div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Загружаю статистику…</p>
  </main>
  <script src="stats.js"></script>
</body>
</html>
