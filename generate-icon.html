<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<canvas id="c" width="256" height="256" style="display:none"></canvas>
<script>
const { ipcRenderer } = require('electron');
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const cx = 128, cy = 128, R = 124;

// Dark circle (transparent outside — no background fill)
ctx.beginPath();
ctx.arc(cx, cy, R, 0, Math.PI * 2);
ctx.fillStyle = '#0d0d16';
ctx.fill();

// Very subtle amber rim — no white
ctx.beginPath();
ctx.arc(cx, cy, R - 1, 0, Math.PI * 2);
ctx.strokeStyle = 'rgba(255, 155, 45, 0.22)';
ctx.lineWidth = 2;
ctx.stroke();

// Hour ticks
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
  const major = i % 3 === 0;
  const len = major ? 9 : 5;
  const r0 = R - 8;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
  ctx.lineTo(cx + Math.cos(a) * (r0 - len), cy + Math.sin(a) * (r0 - len));
  ctx.strokeStyle = major ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.40)';
  ctx.lineWidth = major ? 2.5 : 1.5;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// Green progress arc — 75% (45 of 60 min)
const arcR = R - 22;
const progress = 0.75;
ctx.beginPath();
ctx.arc(cx, cy, arcR, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
ctx.strokeStyle = 'hsl(110, 72%, 52%)';
ctx.lineWidth = 10;
ctx.lineCap = 'butt';
ctx.stroke();

// "45:00" text
ctx.font = "bold 54px 'Consolas', 'SF Mono', monospace";
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillStyle = 'rgba(235, 235, 255, 0.92)';
ctx.fillText('45:00', cx, cy);

ipcRenderer.send('icon-ready', c.toDataURL('image/png'));
</script>
</body>
</html>
