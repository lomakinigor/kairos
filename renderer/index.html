<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="widget">
    <div id="brand">Kairos</div>
    <div class="dial-wrap">
      <canvas id="clockCanvas" width="120" height="120"></canvas>
      <span class="dial-label">Время</span>
    </div>
    <div class="dial-wrap">
      <canvas id="timerCanvas" width="120" height="120"></canvas>
      <span class="dial-label" id="modeLabel">Работа</span>
    </div>
    <button id="server-monitor" class="server-monitor" type="button" hidden aria-label="Статус оплаты сервера">
      <span class="server-monitor-light" aria-hidden="true"></span>
    </button>
  </div>
  <div id="notif-container"></div>
  <script src="app.js"></script>
</body>
</html>
